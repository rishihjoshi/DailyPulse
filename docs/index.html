<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- NO viewport-fit=cover (blueprint fix for iOS bottom-gap) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DailyPulse">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg">

  <meta name="application-name" content="DailyPulse">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="theme-color" content="#faf8f4">
  <meta name="description" content="DailyPulse — twice-daily editorial briefings: US &amp; St. Louis news, world, India &amp; immigration, markets, weather for St. Charles, MO, and a daily lesson.">

  <!-- Social preview (SVG banner; some platforms prefer a PNG — swap if needed) -->
  <meta property="og:title" content="DailyPulse">
  <meta property="og:description" content="Twice-daily editorial briefings: US &amp; St. Louis news, world, India, markets, and a daily lesson.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./hero.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="./hero.svg">

  <!-- Editorial type (Newsreader headlines / Roboto body); swap avoids FOIT, Georgia/system fallback works offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=Roboto:wght@400;500;700&display=swap">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>DailyPulse</title>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-row">
        <div class="brand">
          <span class="wordmark">DailyPulse</span>
          <h1 id="tab-title">USA</h1>
        </div>
        <div class="header-meta">
          <span class="live" aria-label="Live — updates twice daily"><span class="live-dot" aria-hidden="true"></span>LIVE</span>
          <span id="updated" class="updated"></span>
          <span id="version" class="version"></span>
        </div>
      </div>
    </header>

    <main class="main-content" id="main" role="region" aria-labelledby="tab-title" tabindex="-1">
      <div id="loading" class="loading">Loading your briefing…</div>
    </main>

    <div id="update-banner" class="update-banner" role="status" hidden>
      <span>A new version is available.</span>
      <button id="update-btn" type="button">Reload</button>
    </div>

    <nav class="bottom-nav" id="nav" aria-label="Sections">
      <button class="nav-btn active" data-tab="local" aria-current="page">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>USA</span>
      </button>
      <button class="nav-btn" data-tab="world">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        <span>World</span>
      </button>
      <button class="nav-btn" data-tab="india">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>
        <span>India</span>
      </button>
      <button class="nav-btn" data-tab="finance">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-4 4"/></svg>
        <span>Finance</span>
      </button>
      <button class="nav-btn" data-tab="micro">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        <span>Learn</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
