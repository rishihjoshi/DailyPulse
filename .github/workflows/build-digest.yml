name: Build daily digest

on:
  schedule:
    # 11:00 and 23:00 UTC ≈ 6am / 6pm America/Chicago (CDT). Adjust ±1h over DST if you care.
    - cron: '0 11,23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Platform-level ceiling, independent of anything the script gets right. A healthy
    # run takes ~50s; two hung runs sat 20+ minutes and would otherwise have burned the
    # 6-hour default before anyone noticed. On timeout the failure step opens the issue.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-digest.mjs
      - name: Publish digest to the data branch (Vercel ignores it, so no redeploy)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Create the data branch off main the first time; afterward just update the file.
          if ! gh api "repos/$REPO/branches/data" >/dev/null 2>&1; then
            base=$(gh api "repos/$REPO/git/refs/heads/main" --jq .object.sha)
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/data" -f sha="$base"
          fi
          sha=$(gh api "repos/$REPO/contents/digest.json?ref=data" --jq .sha 2>/dev/null || true)
          b64=$(base64 -w0 docs/data/digest.json)
          gh api -X PUT "repos/$REPO/contents/digest.json" \
            -f message="chore: refresh digest $(date -u +%FT%TZ)" \
            -f content="$b64" \
            -f branch=data \
            ${sha:+-f sha="$sha"}
      - name: Open an issue if the build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open issue at a time — update it rather than spamming a new one each run.
          gh label create build-failure --color B60205 --description "Scheduled digest build failed" --force
          open=$(gh issue list --state open --label build-failure --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --title "Digest build failed" --label build-failure \
              --body "The scheduled digest build failed. Latest run: $RUN_URL"
          else
            num=$(gh issue list --state open --label build-failure --json number --jq '.[0].number')
            gh issue comment "$num" --body "Failed again — latest run: $RUN_URL"
          fi
